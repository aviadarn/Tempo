[/Script/Engine.GameUserSettings]
; The window settings below are only read when Version matches the engine's
; UE_GAMEUSERSETTINGS_VERSION (5 in UE 5.7 and 5.8).
Version=5

; Windowed (EWindowMode::Windowed). A Tempo sim is normally driven by a client on
; the same desktop, so a fullscreen window is rarely what anyone wants. Resolution
; is deliberately left unset: the host project can set ResolutionSizeX/Y, and
; without it the engine picks a convenient size smaller than the desktop.
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
